# Static site for review.varuntx.us. The visitor's logs never reach this server: analysis runs in their browser.
# Counting is the only logging: one line per page load and one per finished report, with no IP address,
# user agent or referrer. The lines go to stdout and to /var/log/counts/counts.log, which the deployment
# mounts as a volume so counts survive redeploys. Count them with:
#   docker exec <container> grep -c ' report$' /var/log/counts/counts.log
log_format counts '$time_iso8601 $counted';
map $request_uri $counted {
  default      "";
  "/"          "visit";
  "/index.html" "visit";
  "~^/ping\?e=report$" "report";
}
map $counted $loggable { "" 0; default 1; }

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  access_log /dev/stdout counts if=$loggable;
  access_log /var/log/counts/counts.log counts if=$loggable;

  # The page talks to nobody but this server; Pyodide needs WebAssembly compilation.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

  location / { try_files $uri $uri/ =404; expires -1; }
  location = /ping { return 204; }
  # The container health check probes here, so it never counts as a visit.
  location = /healthz { return 204; }
  location /pyodide/ { expires 30d; }
  location ~ \.wasm$ { types { } default_type application/wasm; expires 30d; }

  gzip on;
  gzip_types application/javascript application/json application/wasm text/css image/svg+xml;
}
