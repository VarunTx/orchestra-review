[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orchestra-review"
version = "0.2.2"
description = "Finds the mistakes your coding agents repeat across sessions, from local logs, fixes each with one instruction line, and blocks them live"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "VarunTx"}]
keywords = ["claude-code", "codex", "opencode", "coding-agents", "agents", "developer-tools", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/VarunTx/orchestra-review"
Issues = "https://github.com/VarunTx/orchestra-review/issues"

[project.scripts]
orchestra-review = "orchestra_review.cli:main"

[tool.setuptools]
packages = ["orchestra_review"]

[tool.pytest.ini_options]
testpaths = ["tests"]
